<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>

<body>
          <section id="secao-frases-container" class="hidden w-full space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-2">Pensamentos e Mensagens</h3>
            <div id="lista-frases-do-dia" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[320px] overflow-y-auto pr-1">
                <!-- Os cards gerados aparecem aqui dinamicamente controlados pelo main.js -->
            </div>
            <div class="flex flex-col items-center justify-center gap-3 text-center pt-2">
                <p class="text-sm text-orange-600 dark:text-orange-300 font-medium max-w-xs">
                    Compartilhe um momento, uma inspiração ou uma boa energia com o mundo!
                </p>
                <button onclick="abrirModalFrase()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-4 rounded-full shadow-lg transition-all hover:scale-105 flex items-center gap-2 border-2 border-white/40 font-medium" title="Enviar Mensagem do Dia">
                    <span>Deixe sua mensagem</span>
                    <i data-lucide="message-square-plus" class="w-5 h-5"></i>
                </button>
            </div>
        </section>

</body>

</html>
