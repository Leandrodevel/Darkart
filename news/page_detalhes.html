<!---BOTAO COMPARTILHAR-->
<button onclick="compartilharPaginaAtual()" class="fixed top-4 right-4 z-50 bg-emerald-600 hover:bg-emerald-700 text-white border border-emerald-500 p-3 rounded-full shadow-lg transition-all hover:scale-105 cursor-pointer flex items-center justify-center" title="Compartilhar página">

</button>
<script>    
    async function compartilharPaginaAtual() {
    const dadosCompartilhamento = {
        title: "Esqualize-se News",
        text: "Veja este artigo que encontrei, aposto que você vai gostar",
        url: window.location.href
    };

    // Tenta usar a API nativa de compartilhamento do dispositivo (celular/desktop compatível)
    if (navigator.share) {
        try {
            await navigator.share(dadosCompartilhamento);
        } catch (erro) {
            // Se o usuário cancelar o compartilhamento, não faz nada
            if (erro.name !== 'AbortError') {
                console.error("Erro ao compartilhar:", erro);
            }
        }
    } else {
        // Fallback: Se o navegador não suportar, copia o link para a área de transferência
        try {
            await navigator.clipboard.writeText(window.location.href);
            if (typeof mostrarAvisoFlutuante === 'function') {
                mostrarAvisoFlutuante("Link copiado para a área de transferência!");
            } else {
                alert("Link copiado!");
            }
        } catch (erro) {
            console.error("Erro ao copiar link:", erro);
        }
    }
}
</script>

    <!-- Script de Busca no Supabase e Renderização -->

        // CONFIGURAÇÃO DO SUPABASE (Insira suas chaves reais aqui)
const SUPABASE_URL = 'https://pgotayoloyhyufgicvhd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBnb3RheW9sb3loeXVmZ2ljdmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDg1ODAsImV4cCI6MjEwNTQ4NDU4MH0.yrW90hK_8QaR3Y4wAz-M6k9Lw2x7zXiQo0n6TQsHB94';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function carregarMateriaDinamica() {
            // Pega o ID da URL (ex: detalhe.html?id=1)
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            const container = document.getElementById('materiaContainer');

            if (!id) {
                container.innerHTML = `<div class="text-center py-10"><p class="text-rose-600 font-medium">Matéria não especificada.</p><a href="../index.html" class="inline-block mt-4 text-xs font-bold text-emerald-700 underline">Voltar ao início</a></div>`;
                return;
            }

            try {
                // Busca a matéria no Supabase pelo ID
                const { data, error } = await _supabase
                    .from('materias')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error || !data) throw new Error("Matéria não localizada no banco de dados.");

                // Formata a data (created_at) para o padrão legível
                const dataFormatada = new Date(data.created_at).toLocaleDateString('pt-BR', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });

                // Altera o título da aba do navegador
                document.getElementById('pageTitle').innerText = `${data.titulo} - Equalize-se`;

                // Renderiza o conteúdo aplicando exatamente a estrutura da sua página modelo
                container.innerHTML = `
                    <!-- Botão de Voltar -->


                    <!-- Metadados da Matéria -->
                    <div class="space-y-3">
                     

                            <span class="flex items-center gap-1 font-medium">
                                <i data-lucide="calendar" class="w-3.5 h-3.5 text-emerald-700"></i> ${dataFormatada}
                            </span>
                        </div>

                        <h1 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-slate-900 leading-tight">
                            ${data.titulo}
                        </h1>
                    </div>

                    <!-- Foto da Matéria -->
                    <div class="space-y-2">
                        <div class="overflow-hidden rounded-xl border border-slate-200 shadow-sm">
                            <img src="${data.imagem_url}" alt="${data.titulo}" class="w-full h-72 sm:h-[450px] object-cover">
                        </div>
                        <p class="text-[11px] text-slate-400 text-center italic">Leitura recomendada do portal Equalize-se.</p>
                    </div>

                    <!-- Corpo do Texto Completo (quebra linhas automaticamente) -->
                    <div class="text-slate-700 text-sm sm:text-base leading-relaxed space-y-4 pt-2 whitespace-pre-line">
                        ${data.conteudo}
                    </div>
                                        <div>
                        <a href="../index.html" class="inline-flex items-center gap-2 text-xs font-bold text-emerald-700 hover:text-emerald-800 bg-emerald-50 hover:bg-emerald-100 px-3.5 py-2 rounded-xl transition-all border border-emerald-200/60">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i>
                            <span>Voltar ao início</span>
                        </a>
                    </div>
                     <span class="flex items-center gap-1 font-medium text-slate-600">
                                <i data-lucide="user" class="w-3.5 h-3.5 text-emerald-700"></i> ${data.autor}
                            </span>
                `;

                // Recria os ícones do Lucide no conteúdo injetado
                lucide.createIcons();

            } catch (err) {

                                          `;
            }
        }

        carregarMateriaDinamica();
