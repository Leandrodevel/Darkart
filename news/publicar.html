<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Equalize-se</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Quill.js CSS (Estilos do Editor Visual) -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-6 px-4 font-sans flex flex-col justify-between">

    <main class="w-full max-w-[1000px] mx-auto space-y-6">
        
        <!-- Cabeçalho do Painel -->
        <header class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex justify-between items-center">
            <div>
                <h1 class="text-xl font-extrabold bg-gradient-to-r from-emerald-700 to-purple-700 bg-clip-text text-transparent">
                    Painel Equalize-se
                </h1>
                <p class="text-xs text-slate-500">Editor Visual de Matérias e Artigos</p>
            </div>
            <a href="index.html" class="inline-flex items-center gap-2 text-xs font-bold text-slate-600 hover:text-emerald-700 bg-slate-100 px-3.5 py-2 rounded-xl transition-all">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Ver Portal</span>
            </a>
        </header>

        <!-- Formulário de Edição da Matéria -->
        <section class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm space-y-6">
            <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3 flex items-center gap-2">
                <i data-lucide="edit-3" class="w-5 h-5 text-emerald-700"></i> Criar / Editar Matéria
            </h2>

            <div class="space-y-4">
                <!-- Título da Matéria -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Título da Matéria</label>
                    <input type="text" id="titulo-materia" placeholder="Ex: A Fascinante Jornada Além da Matéria" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-600">
                </div>

                <!-- Categoria -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Categoria</label>
                    <select id="categoria-materia" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-600 bg-white">
                        <option value="Projeciologia">Projeciologia</option>
                        <option value="Chakras">Chakras</option>
                        <option value="Arquétipos">Arquétipos</option>
                        <option value="Acolhimento">Acolhimento</option>
                    </select>
                </div>

                <!-- EDITOR VISUAL (QUILL) -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Conteúdo da Matéria (Formatador Visual)</label>
                    <!-- Container onde o Quill vai transformar em editor rico -->
                    <div id="editor-container" style="height: 350px;" class="bg-white rounded-b-xl text-sm">
                        <p>Escreva o texto da sua matéria aqui. Use a barra acima para colocar <strong>negrito</strong>, itálico, títulos e listas.</p>
                    </div>
                </div>

                <!-- Botão de Publicar / Salvar -->
                <div class="pt-4 flex justify-end">
                    <button onclick="salvarMateria()" class="inline-flex items-center gap-2 bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-6 py-3 rounded-xl transition-all shadow-sm text-sm">
                        <i data-lucide="save" class="w-4 h-4"></i> Salvar e Gerar HTML
                    </button>
                </div>
            </div>
        </section>

        <!-- Área de Código Gerado Automaticamente -->
        <section class="bg-slate-900 text-slate-100 border border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
            <h3 class="text-sm font-bold text-emerald-400 flex items-center gap-2">
                <i data-lucide="code" class="w-4 h-4"></i> HTML Gerado pelo Editor (Para copiar para sua página)
            </h3>
            <textarea id="html-gerado" readonly class="w-full h-40 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-300 focus:outline-none" placeholder="O código HTML da sua matéria aparecerá aqui quando clicar em Salvar..."></textarea>
        </section>

    </main>

    <!-- Rodapé -->
    <footer class="text-center py-6 text-xs text-slate-400 font-medium tracking-wider mt-4">
        <span>EQUALIZE-SE &copy; 2026 • PAINEL ADMINISTRATIVO</span>
    </footer>

    <!-- Quill.js Script (Biblioteca do Editor Visual) -->
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

    <!-- Script de Inicialização -->
    <script>
        // Inicializa o editor visual rico na tela
        const quill = new Quill('#editor-container', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ header: [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ list: 'ordered' }, { list: 'bullet' }],
                    ['clean']
                ]
            }
        });

        // Função que pega o que foi escrito visualmente e transforma em HTML limpo
        function salvarMateria() {
            const titulo = document.getElementById('titulo-materia').value;
            const categoria = document.getElementById('categoria-materia').value;
            const conteudoHTML = quill.root.innerHTML; // Pega o HTML formatado automaticamente

            const codigoFinal = `
<!-- Matéria: ${titulo} (${categoria}) -->
<article class="space-y-4">
    <span class="px-2.5 py-1 bg-emerald-50 text-emerald-800 font-semibold rounded-lg text-xs">${categoria}</span>
    <h1 class="text-2xl font-extrabold text-slate-900">${titulo}</h1>
    <div class="text-slate-700 text-base leading-relaxed space-y-4">
        ${conteudoHTML}
    </div>
</article>`;

            document.getElementById('html-gerado').value = codigoFinal.trim();
            alert('Matéria convertida em HTML com sucesso! Copie o código abaixo.');
        }

        // Ativa os ícones do Lucide
        lucide.createIcons();
    </script>
</body>
</html>
