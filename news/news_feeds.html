    <!-- Script de Conexão com o Supabase e Renderização do Feed -->
    <script>
        // Configuração do Supabase (utilizando as mesmas chaves do seu projeto)
        const SUPABASE_URL = 'https://pgotayoloyhyufgicvhd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBnb3RheW9sb3loeXVmZ2ljdmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDg1ODAsImV4cCI6MjEwNTQ4NDU4MH0.yrW90hK_8QaR3Y4wAz-M6k9Lw2x7zXiQo0n6TQsHB94';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("feed-container");

            try {
                // Busca todas as matérias da tabela 'materias' ordenadas da mais recente para a mais antiga
                const { data: materias, error } = await _supabase
                    .from('materias')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw new Error(error.message);

                if (!materias || materias.length === 0) {
                    container.innerHTML = `<p class="col-span-full text-center text-slate-500 py-6">Nenhum relato cadastrado no momento.</p>`;
                    return;
                }

                // Limpa o container de carregamento
                container.innerHTML = "";

                // Cria o card dinamicamente para cada matéria vinda do Supabase
                materias.forEach(materia => {
                    // Formata a data (created_at) para o padrão brasileiro
                    let dataFormatada = "";
                    try {
                        dataFormatada = new Date(materia.created_at).toLocaleDateString('pt-BR', {
                            day: 'numeric',
                            month: 'long',
                            year: 'numeric'
                        });
                    } catch (e) {
                        dataFormatada = "Data recente";
                    }

                    const card = document.createElement("div");
                    card.className = "bg-slate-50 border border-slate-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col justify-between";
                    
                    card.innerHTML = `
                        <div>
               
                            <div class="p-5 space-y-3">
                                <div class="flex items-center gap-2 text-xs text-slate-500">
                                    <span class="px-2 py-0.5 bg-emerald-50 text-emerald-800 font-semibold rounded border border-emerald-200">${materia.categoria || 'relato'}</span>
                                    <span class="flex items-center gap-1">
                                        <i data-lucide="calendar" class="w-3.5 h-3.5 text-emerald-700"></i> ${dataFormatada}
                                    </span>
                                </div>
                                <h2 class="text-lg font-bold text-slate-900 leading-snug hover:text-emerald-700 transition-colors">
                                    <a href="page_detalhes.html?id=${materia.id}">${materia.titulo}</a>
                                </h2>
                                <p class="text-xs sm:text-sm text-slate-600 line-clamp-3">
                                    ${materia.resumo || ''}
                                </p>
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <a href="page_detalhes.html?id=${materia.id}" class="inline-flex items-center gap-1.5 text-xs font-bold text-emerald-700 hover:text-emerald-800 bg-emerald-50 hover:bg-emerald-100 px-3 py-2 rounded-lg transition-all border border-emerald-200">
                                <span>Ler relato completo</span>
                                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                            </a>
                        </div>
                    `;

                    container.appendChild(card);
                });

                // Reinicializa os ícones do Lucide nos novos elementos injetados
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }

            } catch (error) {
                console.error("Erro ao carregar feed:", error);
                container.innerHTML = `
                    <div class="col-span-full text-center py-8 text-rose-500 text-xs font-medium">
                        Erro ao carregar o feed de relatos do banco de dados. Verifique a conexão com o Supabase.
                    </div>
                `;
            }
        });
    </script>
